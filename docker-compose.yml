version: '3.8'

services:
  dualshock_publisher:
    build:
      context: ./dualshock_publisher
      dockerfile: Dockerfile
    privileged: true 
    volumes:
      - /dev/input:/dev/input 
      - ./dualshock_publisher:/app 
    ports:
      - "5556:5556" # Expose ZeroMQ port
    restart: unless-stopped
